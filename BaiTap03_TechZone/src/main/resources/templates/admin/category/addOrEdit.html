<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout-admin}">
<head>
    <title th:text="${pageTitle}">Category Form</title>
</head>
<body>
<div layout:fragment="content">

    <div class="mb-4">
        <h3 class="fw-bold text-dark mb-0" th:text="${pageTitle}"></h3>
        <small class="text-muted">Nhập thông tin danh mục sản phẩm</small>
    </div>

    <div class="card shadow-sm border-0" style="max-width:600px;">
        <div class="card-body">
            <!-- th:object bind truc tiep vao CategoryEntity, action luon tro ve /save -->
            <form th:action="@{/admin/category/save}" th:object="${category}" method="post">

                <!-- id an: null khi them moi, co gia tri khi sua -->
                <input type="hidden" th:field="*{categoryid}">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Tên Category</label>
                    <input type="text" th:field="*{categoryname}" class="form-control" required
                           placeholder="Nhập tên category...">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Link hình ảnh</label>
                    <input type="text" th:field="*{images}" class="form-control"
                           placeholder="https://...">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Trạng thái</label>
                    <select th:field="*{status}" class="form-select">
                        <option value="1">Hoạt động</option>
                        <option value="0">Khoá</option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="bi bi-save"></i> Lưu
                    </button>
                    <a th:href="@{/admin/category/list}" class="btn btn-outline-secondary px-4">
                        <i class="bi bi-arrow-left"></i> Quay lại
                    </a>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>

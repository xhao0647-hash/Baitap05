<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout-admin}">
<head>
    <title>Danh sách Category</title>
</head>
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold text-dark mb-0">Quản Lý Danh Mục</h3>
            <small class="text-muted">Danh sách các nhóm sản phẩm (category) trong hệ thống</small>
        </div>
        <a th:href="@{/admin/category/add}" class="btn btn-success fw-semibold shadow-sm px-3">
            <i class="bi bi-plus-circle me-1"></i> Thêm Category
        </a>
    </div>

    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle"></i> <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- FORM TIM KIEM -->
    <div class="card shadow-sm border-0 mb-3">
        <div class="card-body">
            <form th:action="@{/admin/category/list}" method="get" class="row g-2">
                <div class="col-auto flex-grow-1">
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control"
                           placeholder="Tìm kiếm theo tên category...">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-search"></i> Tìm kiếm
                    </button>
                </div>
                <div class="col-auto" th:if="${keyword != null and !keyword.isEmpty()}">
                    <a th:href="@{/admin/category/list}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle"></i> Xoá lọc
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- BANG DANH SACH -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="text-center" style="width:70px;">STT</th>
                        <th style="width:150px;">Hình ảnh</th>
                        <th>Tên Category</th>
                        <th class="text-center" style="width:130px;">Trạng thái</th>
                        <th class="text-center" style="width:150px;">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(listcate)}">
                        <td colspan="5" class="text-center py-5 text-muted">
                            <i class="bi bi-inbox fs-1 d-block mb-2 opacity-50"></i>
                            Chưa có category nào.
                        </td>
                    </tr>
                    <tr th:each="cate, stt : ${listcate}">
                        <td class="text-center fw-bold text-secondary"
                            th:text="${stt.index + 1 + (currentPage * pageSize)}"></td>
                        <td>
                            <img th:src="${cate.images != null and !cate.images.isEmpty()} ? ${cate.images} : 'https://via.placeholder.com/80x60?text=No+Image'"
                                 th:alt="${cate.categoryname}"
                                 style="width:80px;height:60px;object-fit:cover;border-radius:6px;"
                                 class="border shadow-sm">
                        </td>
                        <td class="fw-semibold" th:text="${cate.categoryname}"></td>
                        <td class="text-center">
                            <span th:if="${cate.status != null and cate.status == 1}"
                                  class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1">
                                <i class="bi bi-check-circle"></i> Hoạt động
                            </span>
                            <span th:unless="${cate.status != null and cate.status == 1}"
                                  class="badge bg-secondary-subtle text-secondary border px-2 py-1">
                                <i class="bi bi-slash-circle"></i> Khoá
                            </span>
                        </td>
                        <td class="text-center">
                            <div class="btn-group btn-group-sm">
                                <a th:href="@{/admin/category/edit(id=${cate.categoryid})}"
                                   class="btn btn-outline-warning" title="Sửa">
                                    <i class="bi bi-pencil-square"></i>
                                </a>
                                <a th:href="@{/admin/category/delete(id=${cate.categoryid})}"
                                   class="btn btn-outline-danger" title="Xoá"
                                   onclick="return confirm('Bạn có chắc muốn xoá category này?');">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- PHAN TRANG -->
    <nav class="mt-3" th:if="${pageResult.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${pageResult.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/category/list(page=${currentPage - 1}, size=${pageSize}, keyword=${keyword})}">«</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, pageResult.totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link"
                   th:href="@{/admin/category/list(page=${i}, size=${pageSize}, keyword=${keyword})}"
                   th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${pageResult.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/category/list(page=${currentPage + 1}, size=${pageSize}, keyword=${keyword})}">»</a>
            </li>
        </ul>
    </nav>

</div>
</body>
</html>

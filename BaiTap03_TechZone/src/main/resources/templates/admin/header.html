<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="header" class="bg-white shadow-sm border-bottom">
    <div class="container d-flex justify-content-between align-items-center py-2">

        <div class="d-flex align-items-center gap-2">
            <!-- The <img> avatar ca nhan bat buoc theo yeu cau -->
            <img class="avatar-header"
                 src="https://i.pravatar.cc/150?img=12"
                 alt="Avatar sinh viên thực hiện">
            <div>
                <div class="fw-bold text-dark">TechZone Admin</div>
                <small class="text-muted">Hệ thống quản lý danh mục sản phẩm</small>
            </div>
        </div>

        <nav>
            <a th:href="@{/admin/category/list}" class="btn btn-outline-primary btn-sm">
                <i class="bi bi-tags"></i> Quản lý Category
            </a>
        </nav>

    </div>
</header>

</body>
</html>

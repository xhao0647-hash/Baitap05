spring.application.name=BaiTap03_TechZone
server.port=8080

# ==== Cau hinh MySQL ====
spring.datasource.url=jdbc:mysql://localhost:3306/techzone_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==== Cau hinh Hibernate / JPA ====
# update: tu dong tao/cap nhat bang theo entity, khong xoa du lieu cu
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==== Cau hinh Thymeleaf ====
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
# false khi dev de xem thay doi giao dien ngay khong can restart
spring.thymeleaf.cache=false

# ==== Upload file (neu can) ====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
